<html lang="en">

    <link rel="icon" type="image/svg+xml" href="" />
    <link rel="stylesheet" href="./assets/verity-theme.css" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HWLK0PZVBM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-HWLK0PZVBM', { send_page_view: false });
    </script>
    <script type="module" crossorigin src="./nWkOiD-z.js"></script>
    <link rel="modulepreload" crossorigin href="./chunks/C9Pixl2X.js">
  </head>
  <body>
    <div id="root"></div>
    <style>
      body {
        background-size: 24px 24px;
        opacity: 1;
      }
    </style>
  
    <script>
      // Keep the browser title and any exact visible old brand text on the local copy renamed.
      (() => {
        const rename = () => {
          document.title = "VerityUB";
          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          const nodes = [];
          while (walker.nextNode()) nodes.push(walker.currentNode);
          for (const node of nodes) {
            if (node.nodeValue && node.nodeValue.includes("DogeUB")) {
              node.nodeValue = node.nodeValue.replaceAll("DogeUB", "VerityUB");
            }
          }
        };
        document.addEventListener("DOMContentLoaded", () => {
          rename();
          new MutationObserver(rename).observe(document.documentElement, {childList:true, subtree:true});
        });
      })();
    </script>
  </body>
</html>
